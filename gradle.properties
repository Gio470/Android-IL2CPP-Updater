# This file was generated by the Gradle 'init' task.
# https://docs.gradle.org/current/userguide/build_environment.html#sec:gradle_configuration_properties

org.gradle.parallel=true
org.gradle.caching=true
# The release variant's dex merge needs more than the 512 MiB default and fails without
# saying why: "Error while merging dex archives" with no cause, on a daemon out of heap.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m
version=1.0.0

# Android
android.useAndroidX=true
android.nonTransitiveRClass=true
