# This file was generated by the Gradle 'init' task.
# https://docs.gradle.org/current/userguide/platforms.html#sub::toml-dependencies-format

[versions]
agp = "8.7.3"
kotlin = "2.0.0"
composeBom = "2024.12.01"
# Expressive Material 3 (MaterialExpressiveTheme, wavy progress, flexible app bars)
# lives in the 1.4.0 alphas; it is internal again in 1.4.0 stable, and the 1.5.0
# alphas demand compileSdk 37 and AGP 9.
material3 = "1.4.0-alpha18"
activityCompose = "1.9.3"
lifecycle = "2.8.7"
jna = "5.14.0"
guava = "33.2.1-jre"
capstone = "3.1.8"
gson = "2.11.0"
slf4j = "2.0.16"

[libraries]
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-ktx = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-material3 = { module = "androidx.compose.material3:material3", version.ref = "material3" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
guava = { module = "com.google.guava:guava", version.ref = "guava" }
capstone = { module = "com.github.zhkl0228:capstone", version.ref = "capstone" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
slf4j = { module = "org.slf4j:slf4j-simple", version.ref = "slf4j" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
ktfmt = { id = "com.ncorti.ktfmt.gradle", version = "0.20.1" }